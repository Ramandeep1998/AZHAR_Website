<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | SAIFI FURNITURE UDYOG</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <div class="admin-login-page">
    <div class="login-card">
      <p class="logo">SAIFI FURNITURE <span>UDYOG</span></p>
      <p class="login-subtitle">Business Owner Panel</p>
      <h2>Admin Login</h2>

      <div id="login-alert" class="admin-alert error" style="display:none;"></div>

      <form id="login-form">
        <div class="admin-form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="owner@saifiudyog.com" autocomplete="email">
        </div>
        <div class="admin-form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Your password" autocomplete="current-password">
        </div>
        <button type="submit" class="admin-btn admin-btn-primary" style="width:100%;justify-content:center;padding:0.9rem;">
          Sign In
        </button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.8rem;">
        <a href="../index.html" style="color:var(--admin-accent);">← Back to Website</a>
        &nbsp;·&nbsp;
        <a href="setup.html" style="color:var(--admin-accent);">Firebase Setup Help</a>
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
  <script src="../js/safe.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const alertEl = document.getElementById('login-alert');
      const form = document.getElementById('login-form');

      if (typeof firebase === 'undefined') {
        alertEl.style.display = 'block';
        alertEl.innerHTML = 'Firebase scripts did not load (network/CDN blocked). Open this page on a network that allows <code>gstatic.com</code>, or use a personal machine. Then hard-refresh.';
        form.querySelector('button').disabled = true;
        return;
      }

      if (typeof FIREBASE_ENABLED === 'undefined' || !FIREBASE_ENABLED) {
        alertEl.style.display = 'block';
        alertEl.innerHTML = 'Firebase not configured. See <a href="setup.html">Setup Help</a>.';
        form.querySelector('button').disabled = true;
        return;
      }

      try {
        initFirebase();
        onAuthChange(user => { if (user) window.location.href = 'dashboard.html'; });
      } catch (err) {
        alertEl.style.display = 'block';
        alertEl.textContent = 'Firebase init failed: ' + (err.message || err);
        form.querySelector('button').disabled = true;
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = form.querySelector('button');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        try {
          await adminLogin(form.email.value.trim(), form.password.value);
          window.location.href = 'dashboard.html';
        } catch (err) {
          alertEl.style.display = 'block';
          if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
            alertEl.textContent = 'Invalid email or password.';
          } else if (err.code === 'auth/configuration-not-found') {
            alertEl.innerHTML = '<strong>Enable Authentication in Firebase Console</strong><br>Authentication → Get started → Enable Email/Password.<br><a href="setup.html">Setup guide</a>';
          } else if (err.code === 'auth/network-request-failed') {
            alertEl.textContent = 'Network blocked talking to Firebase. Use a network that allows Firebase, then try again.';
          } else {
            alertEl.textContent = err.message || String(err);
          }
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
